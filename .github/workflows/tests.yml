name: Tests

on:
  pull_request:
  push:
    branches:
      - dev
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check repository
        run: |
          echo "Repository:"
          pwd
          echo "Files:"
          find . -maxdepth 2 -type f | sort