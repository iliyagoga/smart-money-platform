name: Tests

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [analytics-service, api-gateway, backtest-service, decision-service, exchange-gateway, execution-service, elliott-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt pytest==9.1.1 pytest-asyncio==1.4.0
      - run: python -m pytest -q

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -f services/data-service/pom.xml verify
