services:

  postgres:
    image: timescale/timescaledb:latest-pg17
    container_name: smart-money-postgres
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-3g}
    mem_reservation: 1g
    shm_size: 256m
    # Override timescaledb-tune defaults derived from the host's full RAM/CPU.
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - autovacuum_work_mem=64MB
      - -c
      - max_parallel_workers_per_gather=2
      - -c
      - max_parallel_maintenance_workers=1
      - -c
      - max_parallel_workers=4

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: smart-money-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: smart-money-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-CHANGE_ME}
      KC_HOSTNAME: http://localhost:8080
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infrastructure/keycloak/realm-smart-money.json:/opt/keycloak/data/import/realm-smart-money.json:ro

  data-service:
    build:
      context: ./services/data-service
      dockerfile: Dockerfile

    container_name: smart-money-data-service
    restart: unless-stopped

    environment:
      ENVIRONMENT: ${ENVIRONMENT}

      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}

      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      REDIS_URL: ${REDIS_URL}

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10

  elliott-service:
    build:
      context: .
      dockerfile: services/elliott-service/Dockerfile
    container_name: smart-money-elliott-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL}
    ports:
      - "8010:8010"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      data-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8010/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  decision-service:
    build:
      context: ./services/decision-service
      dockerfile: Dockerfile
    container_name: smart-money-decision-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.60}
      CONFLICT_MIN_DELTA: ${CONFLICT_MIN_DELTA:-0.10}
      DEFAULT_CAPITAL: ${DEFAULT_CAPITAL:-10000}
    ports:
      - "8020:8020"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      elliott-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8020/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  execution-service:
    build:
      context: ./services/execution-service
      dockerfile: Dockerfile
    container_name: smart-money-execution-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL}
      EXECUTION_MODE: ${EXECUTION_MODE:-paper}
      STREAM_GROUP: execution-service
      CONSUMER_NAME: execution-1
    ports:
      - "8030:8030"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      decision-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8030/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  analytics-service:
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile
    container_name: smart-money-analytics-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL}
      INITIAL_CAPITAL: ${INITIAL_CAPITAL:-10000}
      BASE_CURRENCY: ${BASE_CURRENCY:-USDT}
    ports:
      - "8040:8040"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      execution-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8040/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  backtest-service:
    build:
      context: .
      dockerfile: services/backtest-service/Dockerfile
    container_name: smart-money-backtest-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATA_SERVICE_URL: http://data-service:8000
      MAX_CANDLES: ${BACKTEST_MAX_CANDLES:-2000000}
      JOB_CONCURRENCY: ${BACKTEST_JOB_CONCURRENCY:-2}
    ports:
      - "8085:8080"
    depends_on:
      postgres:
        condition: service_healthy
      data-service:
        condition: service_healthy
      elliott-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  exchange-gateway:
    build:
      context: ./services/exchange-gateway
      dockerfile: Dockerfile
    container_name: smart-money-exchange-gateway
    restart: unless-stopped
    environment:
      OKX_REST_URL: ${OKX_REST_URL:-https://www.okx.com}
      OKX_PUBLIC_WS_URL: ${OKX_PUBLIC_WS_URL:-wss://ws.okx.com:8443/ws/v5/public}
      OKX_BUSINESS_WS_URL: ${OKX_BUSINESS_WS_URL:-wss://ws.okx.com:8443/ws/v5/business}
      OKX_PRIVATE_WS_URL: ${OKX_PRIVATE_WS_URL:-wss://wspap.okx.com:8443/ws/v5/private}
      OKX_API_KEY: ${OKX_API_KEY:-}
      OKX_SECRET_KEY: ${OKX_SECRET_KEY:-}
      OKX_PASSPHRASE: ${OKX_PASSPHRASE:-}
      OKX_DEMO: ${OKX_DEMO:-true}
      TRADING_ENABLED: ${OKX_TRADING_ENABLED:-false}
      MARGIN_MODE: ${OKX_MARGIN_MODE:-cross}
      MARKET_DATA_ENABLED: ${OKX_LIVE_MARKET_ENABLED:-true}
      EXCHANGE_SYMBOLS: ${EXCHANGE_SYMBOLS:-BTC-USDT-SWAP}
      SYMBOLS: ${EXCHANGE_SYMBOLS:-BTC-USDT-SWAP}
      TIMEFRAMES: ${EXCHANGE_TIMEFRAMES:-M1,M5,M15,M30,H1,H4,D1}
      DATA_SERVICE_URL: http://data-service:8000
      ELLIOTT_SERVICE_URL: http://elliott-service:8010
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL}
      HISTORY_CONCURRENCY: ${HISTORY_CONCURRENCY:-2}
    ports:
      - "8070:8070"
    depends_on:
      data-service:
        condition: service_healthy
      elliott-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8070/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: smart-money-api-gateway
    restart: unless-stopped
    environment:
      KEYCLOAK_ISSUER: http://localhost:8080/realms/smart-money
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/smart-money/protocol/openid-connect/certs
      KEYCLOAK_CLIENT_ID: smart-money-api
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_REALM: smart-money
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-CHANGE_ME}
      DATA_SERVICE_URL: http://data-service:8000
      ELLIOTT_SERVICE_URL: http://elliott-service:8010
      DECISION_SERVICE_URL: http://decision-service:8020
      EXECUTION_SERVICE_URL: http://execution-service:8030
      ANALYTICS_SERVICE_URL: http://analytics-service:8040
      BACKTEST_SERVICE_URL: http://backtest-service:8080
      EXCHANGE_SERVICE_URL: http://exchange-gateway:8070
      REDIS_URL: ${REDIS_URL}
    ports:
      - "8050:8050"
    depends_on:
      keycloak:
        condition: service_started
      redis:
        condition: service_started
      data-service:
        condition: service_healthy
      elliott-service:
        condition: service_healthy
      decision-service:
        condition: service_healthy
      execution-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
      backtest-service:
        condition: service_healthy
      exchange-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8050/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8050}
        NEXT_PUBLIC_KEYCLOAK_URL: ${NEXT_PUBLIC_KEYCLOAK_URL:-http://localhost:8080}
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID:-smart-money-api}
    container_name: smart-money-frontend
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  keycloak_data:
